name: Keep Alive Render Service

on:
  schedule:
    # Triggers long-running 5.8-hour pinging sessions automatically
    - cron: '0 0,5,10,15,20 * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions tab

permissions:
  contents: write

jobs:
  ping:
    name: Ping Render Web Service
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Allow up to 6 hours max execution

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run 5.8-Hour Active Session (Pings Every 5 Minutes)
        run: node ping.js

      - name: Commit and push ping history
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pings.json
          git diff-index --quiet HEAD || (git commit -m "Update ping history log [skip ci]" && git push)
